<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="dns-prefetch" href="https://kit.fontawesome.com" />
    <title>Ploiu</title>
    <link rel="stylesheet" href="./css/index.css" />
    <script async type="module" src="./js/components/Footer.mjs"></script>
    <style>
      #softwareProjectList {
        margin-top: 1em;
        padding: 1em;
        /* prevent large layout shifts by having a minimum height */
        min-height: 20vh;
      }

      footer {
        display: flex;
        justify-content: center;
        & .col {
          margin-bottom: 0.5em;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <h1>Welcome to a Garbage Website</h1>
      <theme-chooser></theme-chooser>
    </header>
    <main>
      <section id="softwareProjects" class="">
        <h2>Software Projects</h2>
        <div id="softwareProjectList" class="row"></div>
      </section>
      <!-- <section id="otherProjects">
            <h2>Other Projects</h2>
            <div id="otherProjectList" class="row">
                TODO
            </div>
        </section> -->
    </main>
    <footer-element></footer-element>
    <!-- doc load scripts -->
    <script async type="module" src="/js/components/ThemeChooser.mjs"></script>
    <!-- without this, the browser will try and load fontawesome first even though it's at the bottom of the screen. That's AWFUL for performance -->
    <script async type="module" src="/js/components/Card.mjs"></script>
    <script async>
      /* theme selection */
      globalThis.setTheme = (theme) => {
        document.querySelector('html').setAttribute('data-theme', theme);
        localStorage.setItem('theme', theme);
      };
      const defaultTheme = localStorage.getItem('theme') ?? 'gb-studio';
      setTheme(defaultTheme);
    </script>
    <!--custom element stuff until it inevitably gets too large-->
    <script async type="module">
      import { genCards } from './js/cards.mjs';
      const projectSection = document.querySelector('#softwareProjectList');
      genCards('projects').forEach((it) => projectSection.appendChild(it));
    </script>
    <script async src="js/cheats.js"></script>
    <!--icons because I can't design good ones to save my life-->
    <script src="https://kit.fontawesome.com/96203dce8f.js" crossorigin="anonymous"></script>
  </body>
</html>
