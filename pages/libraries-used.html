<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ploiu - Libraries Used</title>
    <link rel="stylesheet" href="/css/index.css" />
    <script async type="module" src="/js/components/Footer.mjs"></script>
    <style>
      .dependency {
        padding: 1em;
      }
    </style>
  </head>
  <body>
    <header class="container-fluid">
      <h1>Libraries Used for a <a href="/">Garbage Website</a></h1>
      <theme-chooser></theme-chooser>
    </header>

    <main class="container">
      <a class="dependency" href="https://simplegrid.io">simplegrid</a>
      <a class="dependency" href="https://github.com/elad2412/the-new-css-reset">New CSS Reset</a>
      <a class="dependency" href="https://fontawesome.com">FontAwesome</a>
    </main>

    <footer-element></footer-element>
    <script async type="module" src="/js/components/ThemeChooser.mjs"></script>
    <script async>
      /* theme selection */
      globalThis.setTheme = (theme) => {
        document.querySelector('html').setAttribute('data-theme', theme);
        localStorage.setItem('theme', theme);
      };
      const defaultTheme = localStorage.getItem('theme') ?? 'dark';
      setTheme(defaultTheme);
    </script>
    <script async src="js/cheats.js"></script>
    <!--icons because I can't design good ones to save my life-->
    <script async src="https://kit.fontawesome.com/96203dce8f.js" crossorigin="anonymous"></script>
  </body>
</html>
